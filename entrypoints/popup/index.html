<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polar for Canvas</title>
  </head>
  <body>
    <main class="popup">
      <header class="popup__head">
        <div class="popup__mark" aria-hidden="true">◳</div>
        <div>
          <h1 class="popup__title">Polar for Canvas</h1>
          <p class="popup__subtitle">Identity for the intelligence era</p>
        </div>
      </header>

      <label class="toggle" for="enabled">
        <span class="toggle__label">
          <span class="toggle__name">Theme</span>
          <span class="toggle__state" id="state">On</span>
        </span>
        <span class="toggle__switch">
          <input type="checkbox" id="enabled" checked />
          <span class="toggle__track"><span class="toggle__thumb"></span></span>
        </span>
      </label>

      <section class="swatches" aria-label="Palette">
        <span class="swatch" style="--c: #171717" title="Night · Surface"></span>
        <span class="swatch" style="--c: #1d1d1d" title="Ash · Raised"></span>
        <span class="swatch" style="--c: #7b7b7b" title="Mist · Secondary"></span>
        <span class="swatch" style="--c: #bdbdbd" title="Snow · Foreground"></span>
        <span class="swatch swatch--accent" style="--c: #3619cc" title="Ether · Accent"></span>
      </section>

      <footer class="popup__foot">
        <span class="mono">000</span>
        <span>A precise, monochrome system.</span>
      </footer>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
